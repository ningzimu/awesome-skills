name: Source eligibility
on:
  # Trusted base workflow only. NEVER check out or execute PR head code here.
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
jobs:
  minimum-stars:
    name: Minimum source stars (50)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check newly listed source repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/check_stars.py
  source-eligibility:
    name: Source eligibility (25 stars, 30 days, 90 days)
    needs: minimum-stars
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the trusted source check to pass
        env:
          CHECK_RESULT: ${{ needs.minimum-stars.result }}
        run: test "$CHECK_RESULT" = success
